services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: git_analyze
      POSTGRES_PASSWORD: git_analyze_dev
      POSTGRES_DB: git_analyze
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U git_analyze -d git_analyze"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
